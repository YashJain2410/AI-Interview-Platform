services:
  - type: web
    name: interview-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: google
      - key: LLM_MODEL
        value: gemini-3.8-flash
      - key: ALLOWED_ORIGINS
        sync: false
